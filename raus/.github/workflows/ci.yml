name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENV: dev
      JWT_SECRET: ci_jwt_secret_value_1234567890
      BOOTSTRAP_ADMIN_USERNAME: admin
      BOOTSTRAP_ADMIN_PASSWORD: ci_bootstrap_admin_password_1234567890
      BOOTSTRAP_INSTALL_TOKEN: ci_bootstrap_install_token
      DATABASE_URL: postgresql+psycopg://creator:creator@localhost:5432/creator_suite_ci
      REDIS_URL: redis://localhost:6379/0
      AUTH_COOKIE_SECURE: "false"
      CORS_ORIGINS: http://localhost:3000
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: creator_suite_ci
          POSTGRES_USER: creator
          POSTGRES_PASSWORD: creator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creator -d creator_suite_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Typecheck
        run: mypy --config-file mypy.ini

      - name: Test with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70

      - name: Backend dependency audit
        run: pip-audit -r requirements.txt

      - name: Validate Alembic upgrade/downgrade chain
        run: python scripts/validate_migrations.py --database-url "$DATABASE_URL"

      - name: Build backend image
        run: docker build -f Dockerfile -t creatorhub-backend:ci .

      - name: Scan backend image with Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.53.0 image --severity CRITICAL --exit-code 1 creatorhub-backend:ci

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Frontend dependency audit (critical)
        run: npm audit --audit-level=critical

      - name: Build frontend image
        run: docker build -f Dockerfile -t creatorhub-frontend:ci .

      - name: Scan frontend image with Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.53.0 image --severity CRITICAL --exit-code 1 creatorhub-frontend:ci

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: creator_suite_e2e
          POSTGRES_USER: creator
          POSTGRES_PASSWORD: creator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creator -d creator_suite_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ENV: dev
      PROJECT_NAME: creator-suite
      DATABASE_URL: postgresql+psycopg://creator:creator@localhost:5432/creator_suite_e2e
      REDIS_URL: redis://localhost:6379/0
      OLLAMA_URL: http://localhost:11434
      BOOTSTRAP_ADMIN_USERNAME: admin
      BOOTSTRAP_ADMIN_PASSWORD: Admin!Pass12345
      BOOTSTRAP_INSTALL_TOKEN: ci_bootstrap_install_token
      CORS_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      TRUSTED_HOSTS: localhost,127.0.0.1
      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_SAMESITE: strict
      JWT_SECRET: ci_jwt_secret_value_1234567890
      E2E_ADMIN_USER: admin
      E2E_ADMIN_PASSWORD: Admin!Pass12345
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start backend API
        working-directory: backend
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend-e2e.log 2>&1 &

      - name: Wait for backend health
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/health/ready > /dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become ready in time"
          exit 1

      - name: Run Playwright E2E suite
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_API_PROXY_TARGET: http://127.0.0.1:8000
        run: |
          npm run dev -- --host 127.0.0.1 --port 3000 > ../frontend-e2e.log 2>&1 &
          npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

      - name: Upload E2E server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-logs
          path: |
            backend-e2e.log
            frontend-e2e.log
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: HEAD~1
          head: HEAD