name: Quality CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate Secrets
        working-directory: .
        env:
          ENV: dev
          JWT_SECRET: ci_validation_jwt_secret_value_1234567890
          POSTGRES_PASSWORD: ci_validation_db_password_1234567890
          BOOTSTRAP_ADMIN_PASSWORD: ci_validation_admin_password_1234567890
        run: bash scripts/validate-secrets.sh

      - name: Lint backend
        run: python -m ruff check app tests

      - name: Format backend check
        run: python -m ruff format --check app tests

      - name: Typecheck backend
        run: python -m mypy --config-file mypy.ini app

      - name: Test backend
        run: python -m pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Backend dependency security audit
        run: python -m pip_audit -r requirements.txt -r requirements-dev.txt

  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Format frontend check
        run: npm run format:check

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Test frontend
        run: npm run test:coverage

      - name: Build frontend
        run: npm run build

      - name: Frontend dependency security audit
        run: npm audit --audit-level=high

  migrations-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_DB: creator_suite_ci
          POSTGRES_USER: creator
          POSTGRES_PASSWORD: creator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creator -d creator_suite_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://creator:creator@localhost:5432/creator_suite_ci
      REDIS_URL: redis://localhost:6379/0
      OLLAMA_URL: http://localhost:11434
      PROJECT_NAME: creator-suite
      CORS_ORIGINS: http://localhost:3000
      JWT_SECRET: ci_jwt_secret_value_1234567890
      BOOTSTRAP_ADMIN_USERNAME: admin
      BOOTSTRAP_ADMIN_PASSWORD: ci_bootstrap_admin_password_1234567890
      BOOTSTRAP_INSTALL_TOKEN: ci_bootstrap_token
      ENV: dev
      AUTH_COOKIE_SECURE: "false"
      SKIP_BOOTSTRAP: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Upgrade database to head
        run: python -m alembic upgrade head

      - name: Verify Alembic state
        run: python -m alembic current --check-heads

      - name: Check model and migration consistency
        run: python -m alembic check

  end-to-end:
    needs: [backend-quality, frontend-quality, migrations-check]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend and browser dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start isolated application stack
        run: |
          cp .env.test.example .env
          docker compose up --build --detach

      - name: Wait for application readiness
        run: |
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:31080/healthz >/dev/null \
              && curl --fail --silent http://127.0.0.1:31800/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1

      - name: Run browser workflows
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:31080
          E2E_ADMIN_USER: admin
          E2E_ADMIN_PASSWORD: test_admin_password_1234567890
          E2E_BOOTSTRAP_TOKEN: test_bootstrap_token_1234567890
        run: npm run e2e:ci

      - name: Show service logs after failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop isolated application stack
        if: always()
        run: docker compose down --volumes --remove-orphans
