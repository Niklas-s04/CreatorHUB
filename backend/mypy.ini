[mypy]
python_version = 3.11
warn_return_any = False
warn_unused_configs = True
ignore_missing_imports = True
pretty = True
exclude = (?x)(alembic|tests)
files = app

# Transitional baseline debt: removing these suppressions exposes widespread
# pre-existing ORM/FastAPI boundary errors. Keep this centralized until those
# modules can be migrated without disguising new per-module failures.
disable_error_code = attr-defined,call-arg,arg-type,assignment,operator,index,union-attr,return-value,var-annotated,import-untyped

[mypy-app.models.*]
ignore_errors = True
