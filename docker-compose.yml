services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Missing POSTGRES_DB environment variable}
      POSTGRES_USER: ${POSTGRES_USER:?Missing POSTGRES_USER environment variable}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD environment variable}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-creator} -d ${POSTGRES_DB:-creator_suite}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Missing DATABASE_URL environment variable}
      REDIS_URL: ${REDIS_URL:?Missing REDIS_URL environment variable}
      CORS_ORIGINS: ${CORS_ORIGINS:?Missing CORS_ORIGINS environment variable}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?Missing TRUSTED_HOSTS environment variable}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:?Missing AUTH_COOKIE_SECURE environment variable}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health/ready | grep -q '\"status\":\"ready\"' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 25s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Missing DATABASE_URL environment variable}
      REDIS_URL: ${REDIS_URL:?Missing REDIS_URL environment variable}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: ["python", "-m", "app.workers.run_worker"]
    healthcheck:
      test: ["CMD", "python", "-c", "from app.workers.queue import redis_conn; redis_conn.ping()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api/v1
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 3s
      retries: 5

volumes:
  db_data:
